services:

  web:
    build: .
    container_name: studio_backend
    command: >
      sh -c " python manage.py migrate && python manage.py runserver 0.0.0.0:8000 "
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  test:
    build: .
    container_name: studio_test
    command: python manage.py test
    volumes:
      - .:/app
