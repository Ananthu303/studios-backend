openapi: 3.0.3
info:
  title: Studio Fitness Booking API
  description: Backend core for boutique fitness studios. Manages studios, classes, credit packs, FIFO credit deductions, idempotent bookings, cancellation cutoffs in studio local time, and waitlist auto-promotions.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegister:
      type: object
      required:
        - phone_number
        - password_1
        - password_2
      properties:
        phone_number:
          type: string
          example: "+919876543210"
        password_1:
          type: string
          format: password
          minLength: 8
        password_2:
          type: string
          format: password
        role:
          type: string
          enum: [MEMBER, STAFF, SUPER_ADMIN]
          default: MEMBER

    UserLogin:
      type: object
      required:
        - phone_number
        - password
      properties:
        phone_number:
          type: string
          example: "+919876543210"
        password:
          type: string
          format: password

    UserDetail:
      type: object
      properties:
        id:
          type: integer
        phone_number:
          type: string
        role:
          type: string
        is_active:
          type: boolean

    TokenPair:
      type: object
      properties:
        message:
          type: string
        access:
          type: string
        refresh:
          type: string

    Studio:
      type: object
      required:
        - name
        - timezone
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: "Downtown Barre"
        timezone:
          type: string
          example: "America/New_York"
        cancellation_cutoff_hours:
          type: integer
          default: 4
          example: 4
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    FitnessClass:
      type: object
      required:
        - studio
        - name
        - start_time
        - duration_minutes
        - spots
        - credit_cost
      properties:
        id:
          type: integer
          readOnly: true
        studio:
          type: integer
          description: Studio ID
        name:
          type: string
          example: "Power Vinyasa"
        start_time:
          type: string
          format: date-time
          example: "2026-10-20T09:00:00Z"
        end_time:
          type: string
          format: date-time
          readOnly: true
        duration_minutes:
          type: integer
          example: 60
        spots:
          type: integer
          example: 12
        confirmed_count:
          type: integer
          readOnly: true
          example: 4
        spots_available:
          type: integer
          readOnly: true
          example: 8
        credit_cost:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CreditPack:
      type: object
      required:
        - member
        - granted_credits
        - expires_at
      properties:
        id:
          type: integer
          readOnly: true
        member:
          type: integer
          description: Member User ID
        granted_credits:
          type: integer
          example: 10
        remaining_credits:
          type: integer
          readOnly: true
          example: 10
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          example: "2026-11-20T00:00:00Z"

    CreditBalance:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        total_credits:
          type: integer
          example: 15
        packs:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              granted_credits:
                type: integer
              remaining_credits:
                type: integer
              expires_at:
                type: string
                format: date-time
              granted_at:
                type: string
                format: date-time

    CreditTransaction:
      type: object
      properties:
        id:
          type: integer
        member:
          type: integer
        pack:
          type: integer
        booking:
          type: integer
          nullable: true
        type:
          type: string
          enum: [C, D]
        description:
          type: string
          enum: [PG, BC, CR]
        cause:
          type: string
          example: "Booking Charge"
        amount:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time

    Booking:
      type: object
      required:
        - fitness_class
      properties:
        id:
          type: integer
          readOnly: true
        member:
          type: integer
          readOnly: true
        fitness_class:
          type: integer
          description: Fitness Class ID
        status:
          type: string
          enum: [CONFIRMED, WAITING_LIST, CANCELLED]
          readOnly: true
        slot_number:
          type: integer
          readOnly: true
          nullable: true
          example: 1
        idempotency_key:
          type: string
          readOnly: true
        booked_at:
          type: string
          format: date-time
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true

security:
  - bearerAuth: []

paths:
  /users/register/:
    post:
      summary: Register a new user
      description: Allows public registration for members. Super admin can register staff.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'

  /users/login/:
    post:
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

  /users/me/:
    get:
      summary: Get current authenticated user profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'

  /studios/:
    get:
      summary: List studios
      responses:
        '200':
          description: List of studios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Studio'
    post:
      summary: Create studio (Staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Studio'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'

  /classes/:
    get:
      summary: Browse classes across date range
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          example: "2026-10-15"
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          example: "2026-10-25"
        - in: query
          name: studio
          schema:
            type: integer
      responses:
        '200':
          description: List of scheduled classes with spots_available
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FitnessClass'
    post:
      summary: Schedule a class (Staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FitnessClass'
      responses:
        '201':
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessClass'

  /credit-packs/:
    get:
      summary: List member's credit packs
      responses:
        '200':
          description: Packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditPack'
    post:
      summary: Grant credit pack to member (Staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPack'
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPack'

  /credit-packs/balance/:
    get:
      summary: Get credit balance (current or historical as-of)
      parameters:
        - in: query
          name: as_of
          schema:
            type: string
            format: date-time
          description: ISO 8601 datetime to reconstruct past balance
        - in: query
          name: member
          schema:
            type: integer
          description: Member ID (staff only)
      responses:
        '200':
          description: Balance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'

  /credit-transactions/:
    get:
      summary: Report every credit movement with cause
      parameters:
        - in: query
          name: as_of
          schema:
            type: string
            format: date-time
        - in: query
          name: member
          schema:
            type: integer
      responses:
        '200':
          description: Transaction ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditTransaction'

  /bookings/:
    get:
      summary: List member bookings
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [CONFIRMED, WAITING_LIST, CANCELLED]
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      summary: Book a spot on a class
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fitness_class]
              properties:
                fitness_class:
                  type: integer
      responses:
        '201':
          description: Booking created or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  /bookings/{id}/:
    delete:
      summary: Cancel a booking
      description: Settle credits according to cutoff in studio local timezone, release spot, and promote waitlisted member.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
